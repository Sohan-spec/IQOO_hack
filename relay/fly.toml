# Always-on WebSocket ingress. Do not set auto_stop_machines to stop/suspend.
app = "relay-owner-ingress"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    hard_limit = 200
    soft_limit = 150

  [http_service.http_options]
    idle_timeout = 3600

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
  cpus = 1
